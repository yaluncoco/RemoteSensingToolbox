name: Windows validation and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_installer:
        description: Build Windows installer and portable archive
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: Application self-test
        run: python run_toolbox.py --self-test --report .build/source-self-test.json
      - name: Build installer
        if: github.event_name == 'workflow_dispatch' && inputs.build_installer
        shell: pwsh
        run: ./scripts/build_windows.ps1 -Python python -SkipTests
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: .build/*self-test.json
      - name: Upload Windows packages
        if: github.event_name == 'workflow_dispatch' && inputs.build_installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: release/*
